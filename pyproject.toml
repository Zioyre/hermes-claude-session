[project]
name = "claude-agent-session-experimental"
version = "0.1.0"
requires-python = ">=3.10"
# claude-agent-sdk 0.2.176 is vendored (pure Python) in _vendor/; mcp/anyio/jsonschema come from Hermes.
dependencies = []

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["_vendor"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["N999"]
"tests/*" = ["SIM115"]
"options.py" = ["C408"]
"client.py" = ["PYI034"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
